name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never call a real model and never need a secret in CI (template spec §7.3).
      AI_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The mock eval (template spec §5.11, §7.3): the frozen cases of measurements/cases.json
      # through the mock model, at no cost. The mock's answers are known, so the step fails when
      # any case's answer or score differs from the committed measurements/eval-mock.json: it
      # proves the scorer, not the model. It writes nothing, so the build below shows the
      # committed run.
      - run: pnpm eval --check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
